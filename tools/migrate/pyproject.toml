[project]
name = "certinova-migrate"
version = "0.1.0"
description = "One-time MongoDB to Supabase Postgres migration for CertiNova"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/certinova_migrate"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
