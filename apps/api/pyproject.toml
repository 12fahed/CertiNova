[project]
name = "certinova-api"
version = "0.1.0"
description = "CertiNova API: Hasura action and event-trigger handlers, render and email workers"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/certinova_api"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "sqlacodegen>=3.0",
]
